    body.cream-theme .video-card:hover .thumb-wrap {

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-subtle);
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, filter 0.25s ease;
    }
    .video-card:hover .thumb-wrap img {
      transform: scale(1.04);
    }

    /* Video Frame Preview Canvas & Embed Layer */
    .preview-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      display: none;
      pointer-events: none;
    }
    .preview-embed-holder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: none;
      pointer-events: none;
      background: #000;
    }
    .preview-embed-holder iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* Pulse Preview Badge (like YouTube preview badge) */
    .badge-preview {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 8;
      background: rgba(224, 74, 47, 0.95);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 2px 8px;
      border-radius: var(--pill);
      display: none;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      animation: previewBadgePulse 1.8s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes previewBadgePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.88; transform: scale(1.04); }
    }
    .preview-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
      animation: previewDotBlink 0.9s infinite alternate ease-in-out;
    }
    @keyframes previewDotBlink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Mini Scrubber Bar on Thumbnail */
    .preview-scrub-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(0, 0, 0, 0.45);
      z-index: 7;
      opacity: 0;
      transition: opacity 0.2s ease, height 0.2s ease;
      pointer-events: none;
    }
    .preview-scrub-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, #ff7357 100%);
      box-shadow: 0 0 8px rgba(224, 74, 47, 0.8);
      transition: width 0.08s linear;
    }

    /* Floating Timestamp on Desktop Hover */
    .preview-time-bubble {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 10, 8, 0.92);
      color: var(--cream);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      pointer-events: none;
      z-index: 9;
      display: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    .video-card.preview-active .badge-preview {

    .video-card.preview-active .preview-scrub-bar {

      height: 5px;

    .video-card.preview-active .badge-cat {

    .video-card.preview-active .preview-canvas {

  function formatAgo(dateStr) {
    if (!dateStr) return "Recently";
    try {
      let raw = String(dateStr).trim();
      if (/^\d{10,13}$/.test(raw)) {
        const n = Number(raw);
        raw = new Date(n < 1e12 ? n * 1000 : n).toISOString();
      }
      const d = new Date(raw.includes("T") ? raw : raw.replace(" ", "T"));
      if (isNaN(d.getTime())) return "Recently";
      const diff = Date.now() - d.getTime();
      if (diff < 0) return "Recently";
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins <= 1 ? "Just now" : mins + " min ago";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + " hour" + (hrs > 1 ? "s" : "") + " ago";
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + " day" + (days > 1 ? "s" : "") + " ago";
      const months = Math.floor(days / 30);
      if (months < 12) return months + " month" + (months > 1 ? "s" : "") + " ago";
      const years = Math.floor(months / 12);
      return years + " year" + (years > 1 ? "s" : "") + " ago";
    } catch {
      return "Recently";
    }
  }

    /** Core fetch — section drives source. XXXtv NEVER for search/category/collection. */
    async fetchVideos({ page = 1, typeId = null, keyword = null, section = "feed" } = {}) {
      // HARD RULE: never call xxxtv for search / category / collection
      const forbiddenXt = section === "search" || section === "category" || section === "collection"
        || section === "homeCategory" || section === "homeCollection";
      let server = resolveServer(section);
      if (forbiddenXt && server === SRC.XXXTV) {
        server = geo.epornerOk ? SRC.EPORNER : SRC.XVID;
      }
      // Never request Eporner when blocked
      if (server === SRC.EPORNER && !geo.epornerOk) server = SRC.XVID;

      const countryQ = (geo.home && geo.home.query) || "";

      // --- XXXtv (home top / rare feed only) — no keyword/search API ---
      if (server === SRC.XXXTV) {
        try {
          return await xxxtvLatest({ page, limit: PAGE_SIZE, keyword: null });
        } catch (e) {
          console.warn("XXXtv fail → XVID", e.message);
          server = SRC.XVID;
        }
      }

      // --- Eporner ---
      if (server === SRC.EPORNER && geo.epornerOk) {
        try {
          let q = keyword || "all";
          if (typeId && typeId !== "all" && EPORNER_CAT_QUERY[typeId]) {
            q = EPORNER_CAT_QUERY[typeId];
          } else if ((!keyword || keyword === "all") && countryQ && section !== "search") {
            // country-aware default
            q = countryQ;
          }
          return await epornerSearch({ query: q, page, order: "latest", perPage: PAGE_SIZE });
        } catch (e) {
          console.warn("Eporner fail → XVID", e.message);
          server = SRC.XVID;
        }
      }

      // --- XVID fallback / primary when blocked ---
      const params = { ac: "detail", pg: String(page), pagesize: String(PAGE_SIZE) };
      if (typeId && typeId !== "all") params.t = String(typeId);
      if (keyword) params.wd = keyword;
      else if (countryQ && !typeId && section !== "search") params.wd = countryQ;
      const data = await apiFetch(params);
      let list = (data.list || []).map(normalizeVideo).filter(v => v.id);
      if (list.length > PAGE_SIZE) list = list.slice(0, PAGE_SIZE);
      return {
        list,
        page: Number(data.page) || page,
        pagecount: Number(data.pagecount) || 1,
        total: Number(data.total) || list.length
      };
    }

    /** Home: top row = XXXtv, lower = Eporner (if OK) else XVID + country strip */
    async fetchHomeBundle() {
      const seen = new Set();
      let top = [];
      let lower = [];
      let pagecount = 1;
      let total = 0;

      // Top row — XXXtv (required on home in BOTH modes)
      try {
        const xt = await xxxtvLatest({ page: 1, limit: 12, keyword: null });
        top = dedupeList(xt.list || [], seen);
      } catch (e) {
        console.warn("home top XXXtv fail", e.message);
      }

      // Lower rows — Eporner or XVID, country-aware
      const home = geo.home;
      try {
        if (geo.epornerOk) {
          const q = (home && home.query) || "all";
          const ep = await epornerSearch({ query: q, page: 1, order: "latest", perPage: PAGE_SIZE });
          lower = dedupeList(ep.list || [], seen);
          pagecount = ep.pagecount || 1;
          total = ep.total || lower.length;
          // XVID filler if thin
          if (lower.length < 8) {
            const xv = await this.fetchVideos({
              page: 1,
              typeId: home && home.typeId ? home.typeId : null,
              keyword: home && !home.typeId ? home.query : null,
              section: "homeLower"
            });
            // force XVID path already via section when eporner ok uses eporner first — call XVID directly
            const params = { ac: "detail", pg: "1", pagesize: String(PAGE_SIZE) };
            if (home && home.typeId) params.t = String(home.typeId);
            else if (home && home.query) params.wd = home.query;
            try {
              const data = await apiFetch(params);
              const extra = (data.list || []).map(normalizeVideo).filter(v => v.id);
              lower = lower.concat(dedupeList(extra, seen));
            } catch (_) {}
          }
        } else {
          // EPORNER_BLOCKED: XVID only below XXXtv
          const local = await this.fetchVideos({
            page: 1,
            typeId: home && home.typeId ? home.typeId : null,
            keyword: home && !home.typeId ? home.query : null,
            section: "homeLower"
          });
          lower = dedupeList(local.list || [], seen);
          pagecount = local.pagecount || 1;
          total = local.total || lower.length;
        }
      } catch (e) {
        console.warn("home lower fail", e.message);
      }

      // Never empty: if top failed, lower may still show; if both empty try raw XVID
      if (!top.length && !lower.length) {
        const fb = await this.fetchVideos({ page: 1, section: "homeLower" });
        lower = fb.list || [];
        pagecount = fb.pagecount || 1;
        total = fb.total || lower.length;
      }

      return { top, lower, pagecount, total, seen };
    }

    isLiked(id) {
      return this.likes.some(x => x.id === id);
    }

    toggleLike(id) {
      const v = this.activeVideo || this.videos.find(x => x.id === id);
      if (!v) return;
      if (this.isLiked(id)) {
        this.likes = this.likes.filter(x => x.id !== id);
        this.toast("Removed from likes");
      } else {
        this.likes.unshift({
          id: v.id,
          title: v.title,
          thumbnail: v.thumbnail || v.poster,
          duration: v.duration,
          category: v.category
        });
        if (this.likes.length > 100) this.likes.pop();
        this.toast("Liked ❤️");
      }
      localStorage.setItem("p0rn_likes", JSON.stringify(this.likes));
      const btn = document.getElementById("likeBtn");
      if (btn) {
        const on = this.isLiked(id);
        btn.classList.toggle("liked", on);
        btn.querySelector(".like-label").textContent = on ? "Liked" : "Like";
      }
    }

    renderCategoryBar() {
      const bar = document.getElementById("categoryBar");
      if (this.tab !== "home" || this.activeVideo || this.selectedCat) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";

      // Country-specific hot keyword pills (IP-based)
      const hotKeywords = (geo.country && COUNTRY_KEYWORDS[geo.country])
        || (geo.isIndia ? COUNTRY_KEYWORDS.IN : null)
        || [
          { label: "Amateur", kw: "amateur" },
          { label: "MILF", kw: "milf" },
          { label: "Teen", kw: "teen" },
          { label: "POV", kw: "pov" }
        ];

      // Categories already sorted by country priority in loadCategories
      const barCats = [];
      const seen = new Set();
      this.categories.forEach(c => {
        if (barCats.length >= 28) return;
        if (!seen.has(c.id)) { barCats.push(c); seen.add(c.id); }
      });

      let html = `<div class="cat-pill ${this.activeCat === "all" && !this.query ? "active" : ""}" data-cat="all" onclick="app.filterCategory('all')">
        <span>All</span>
      </div>`;

      hotKeywords.forEach(h => {
        const key = "kw:" + h.kw;
        const active = this.activeCat === key || (this.query && this.query.toLowerCase() === h.kw);
        html += `<div class="cat-pill ${active ? "active" : ""}" data-cat="${this.esc(key)}" onclick="app.filterKeyword('${this.esc(h.kw)}')">
          <span>${this.esc(h.label)}</span>
        </div>`;
      });

      barCats.forEach(c => {
        html += `<div class="cat-pill ${this.activeCat === String(c.id) ? "active" : ""}" data-cat="${c.id}" onclick="app.filterCategory('${c.id}')">
          <span>${this.esc(c.name)}</span>
        </div>`;
      });
      bar.innerHTML = html;
    }

    async filterCategory(slug) {
      this.activeCat = String(slug);
      this.query = "";
      const searchInput = document.getElementById("searchInput");
      if (searchInput) searchInput.value = "";
      const clearBtn = document.getElementById("clearBtn");
      if (clearBtn) clearBtn.style.display = "none";
      this.page = 1;
      this.videos = [];
      if (this.tab !== "home") {
        this.tab = "home";
        this.renderNav();
      }
      this.renderCategoryBar();
      setTimeout(() => {
        const pill = document.querySelector(`.cat-pill[data-cat="${slug}"]`);
        if (pill) pill.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }, 50);
      await this.loadAndRenderHome();
    }

    async filterKeyword(kw) {
      this.activeCat = "kw:" + kw;
      this.query = kw;
      const searchInput = document.getElementById("searchInput");
      if (searchInput) searchInput.value = kw;
      const clearBtn = document.getElementById("clearBtn");
      if (clearBtn) clearBtn.style.display = "flex";
      this.page = 1;
      this.videos = [];
      if (this.tab !== "home") {
        this.tab = "home";
        this.renderNav();
      }
      this.renderCategoryBar();
      setTimeout(() => {
        const pill = document.querySelector(`.cat-pill[data-cat="kw:${kw}"]`);
        if (pill) pill.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }, 50);
      await this.loadAndRenderHome();
    }

    selectCategoryAndGoHome(typeId) {
      this.selectedCat = null;
      this.activeVideo = null;
      this.tab = "home";
      this.renderNav();
      this.filterCategory(typeId);
      window.scrollTo({ top: 0, behavior: "smooth" });
      const cat = this.categories.find(c => String(c.id) === String(typeId));
      if (cat) this.toast(`Browsing ${cat.name}`);
    }

    navigate(tab, updateHash = true) {
      // If clicking Home from within Home when a category was active, reset to All
      if (tab === "home" && this.tab === "home" && this.activeCat !== "all" && !this.query) {
        this.filterCategory("all");
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      this.tab = tab;
      this.activeVideo = null;
      this.selectedCat = null;
      this.renderNav();
      this.renderCategoryBar();
      window.scrollTo({ top: 0, behavior: "smooth" });

      // Distinct hash URLs so Home / Collections can index separately
      if (updateHash) {
        try {
          const hashMap = { home: "#home", category: "#collections", history: "#history", account: "#account" };
          const h = hashMap[tab] || "#home";
          if (location.hash !== h) history.replaceState(null, "", h);
        } catch (_) {}
      }

      if (tab === "home") this.loadAndRenderHome();
      else if (tab === "category") this.renderCategories(false);
      else if (tab === "history") this.renderHistory();
      else if (tab === "account") this.renderAccount();
    }

    applyHashRoute() {
      const h = (location.hash || "").toLowerCase();
      if (h === "#collections" || h === "#category" || h === "#collection") {
        this.navigate("category", false);
      } else if (h === "#history") {
        this.navigate("history", false);
      } else if (h === "#account" || h === "#settings") {
        this.navigate("account", false);
      } else if (h === "#home" || h === "" || h === "#") {
        // keep home; only force if not already loading video
        if (!new URLSearchParams(location.search).get("v")) {
          this.tab = "home";
        }
      }
    }

    bindSearch() {
      const input = document.getElementById("searchInput");
      const clear = document.getElementById("clearBtn");

      input.addEventListener("input", e => {
        this.query = e.target.value.trim();
        clear.style.display = this.query ? "flex" : "none";
        clearTimeout(this.searchTimer);
        this.searchTimer = setTimeout(() => {
          if (this.tab !== "home") {
            this.tab = "home";
            this.renderNav();
          }
          this.page = 1;
          this.videos = [];
          this.renderCategoryBar();
          try {
            const q = this.query;
            if (q) {
              const path = "/search/" + encodeURIComponent(q.replace(/\s+/g, "-"));
              history.replaceState({ search: q }, "", path);
            } else {
              history.replaceState({ page: "home" }, "", "/");
            }
          } catch (_) {}
          this.loadAndRenderHome();
        }, 420);
      });

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          clearTimeout(this.searchTimer);
          this.page = 1;
          this.videos = [];
          try {
            const q = this.query;
            if (q) history.pushState({ search: q }, "", "/search/" + encodeURIComponent(q.replace(/\s+/g, "-")));
          } catch (_) {}
          this.loadAndRenderHome();
        }
      });
    }

    clearSearch() {
      this.query = "";
      this.activeCat = "all";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearBtn").style.display = "none";
      this.page = 1;
      this.videos = [];
      try { history.replaceState({ page: "home" }, "", "/"); } catch (_) {}
      this.renderCategoryBar();
      this.loadAndRenderHome();
    }

    toast(msg) {
      const box = document.getElementById("toastBox");
      const el = document.createElement("div");
      el.className = "toast-box";
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 250);
      }, 2200);
    }

      document.getElementById("mainContainer").innerHTML = `
        <div class="loading-box">
          <div class="spinner"></div>
          <p>${this.esc(msg)}</p>
        </div>`;

        <div class="empty-box">
          <h3>Something went wrong</h3>
          <p>${this.esc(msg)}</p>
          <button class="ctrl-btn solid" onclick="location.reload()">Retry</button>

    card(v, idx = 99) {
      const hi = v.thumbnail || v.poster || "";
      const lo = v.poster && v.thumbnail && v.poster !== v.thumbnail ? v.poster : "";
      let img = `<div class="cat-placeholder">▶</div>`;
      if (hi) {
        const src = lo || hi;
        const dataHi = lo ? hi : "";
        const eager = idx < 8;
        const prio = idx < 4 ? "high" : (eager ? "auto" : "low");
        img = `<img src="${this.esc(src)}" alt="${this.esc(v.title)}" loading="${eager ? "eager" : "lazy"}" decoding="async" fetchpriority="${prio}" class="lq" data-hi="${this.esc(dataHi)}" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`;
      }
      return `
        <a href="${videoPath(v)}" class="video-card" data-video-id="${this.esc(v.id)}" data-duration="${this.esc(v.duration)}" data-embed="${this.esc(v.embed || '')}" data-preview="${this.esc(v.preview || '')}" data-thumb="${this.esc(hi)}" onclick="app.onCardClick('${this.esc(v.id)}', event)" onmouseenter="app.onCardHover(this, event)" onmousemove="app.onCardMove(this, event)" onmouseleave="app.onCardLeave(this, event)">
          <div class="thumb-wrap">
            ${img}
            <canvas class="preview-canvas"></canvas>
            <div class="preview-embed-holder"></div>
            <div class="badge-preview">
              <span class="preview-dot"></span>
              <span>PREVIEW</span>
            </div>

    onCardClick(id, event) {

    /* PREVIEW ENGINE (Desktop Cursor Move & Scroll Intersection) */
    parseDurationToSeconds(str) {
      if (!str || str === "—") return 600;
      try {
        const parts = String(str).trim().split(":").map(Number);
        if (parts.length === 3 && !parts.some(isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2 && !parts.some(isNaN)) return parts[0] * 60 + parts[1];
        const n = parseInt(str);
        if (!isNaN(n)) return n * 60;
      } catch (_) {}
      return 600;
    }

    formatPreviewTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    onCardHover(card, e) {
      if (!card) return;
      card._hoverActive = true;
      clearTimeout(card._hoverTimer);
      card._hoverTimer = setTimeout(() => {
        if (card._hoverActive) {
          this.startCardPreview(card, "hover");
        }
      }, 140);
    }

    onCardMove(card, e) {
      if (!card) return;
      card._hoverActive = true;
      const wrap = card.querySelector(".thumb-wrap");
      if (!wrap) return;
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

      if (!card.classList.contains("preview-active")) {
        this.startCardPreview(card, "hover");
      }

      const fill = card.querySelector(".preview-scrub-fill");
      if (fill) fill.style.width = (pct * 100) + "%";

      const bubble = card.querySelector(".preview-time-bubble");
      const totalSec = this.parseDurationToSeconds(card.dataset.duration);
      const curSec = Math.floor(pct * totalSec);
      if (bubble) {
        bubble.style.display = "block";
        bubble.style.left = (pct * 100) + "%";
        bubble.textContent = this.formatPreviewTime(curSec) + " / " + this.formatPreviewTime(totalSec);
      }

      this.renderFrameCanvas(card, pct);

      if (!card._embedLoaded) {
        clearTimeout(card._embedTimer);
        card._embedTimer = setTimeout(() => {
          if (card._hoverActive && card.dataset.embed) {
            this.mountPreviewEmbed(card);
          }
        }, 360);
      }
    }

    onCardLeave(card, e) {
      if (!card) return;
      card._hoverActive = false;
      clearTimeout(card._hoverTimer);
      clearTimeout(card._embedTimer);
      this.stopCardPreview(card);
    }

    startCardPreview(card, source = "hover") {
      if (source === "hover" && this._activeScrollCard && this._activeScrollCard !== card) {
        this.stopCardPreview(this._activeScrollCard);
        this._activeScrollCard = null;
      }
      card.classList.add("preview-active");

      if (source === "scroll") {
        const fill = card.querySelector(".preview-scrub-fill");
        let start = Date.now();
        const durationMs = 8000;
        cancelAnimationFrame(card._scrollAnim);
        const loopScrub = () => {
          if (!card.classList.contains("preview-active")) return;
          const elapsed = (Date.now() - start) % durationMs;
          const pct = elapsed / durationMs;
          if (fill) fill.style.width = (pct * 100) + "%";
          this.renderFrameCanvas(card, pct);
          card._scrollAnim = requestAnimationFrame(loopScrub);
        };
        card._scrollAnim = requestAnimationFrame(loopScrub);

        clearTimeout(card._scrollEmbedTimer);
        card._scrollEmbedTimer = setTimeout(() => {
          if (card.classList.contains("preview-active") && card.dataset.embed) {
            this.mountPreviewEmbed(card);
          }
        }, 400);
      }
    }

    stopCardPreview(card) {
      if (!card) return;
      card.classList.remove("preview-active");
      cancelAnimationFrame(card._scrollAnim);
      clearTimeout(card._scrollEmbedTimer);
      clearTimeout(card._embedTimer);

      const fill = card.querySelector(".preview-scrub-fill");
      if (fill) fill.style.width = "0%";

      const bubble = card.querySelector(".preview-time-bubble");
      if (bubble) bubble.style.display = "none";

      const canvas = card.querySelector(".preview-canvas");
      if (canvas) canvas.style.display = "none";

      const embedHolder = card.querySelector(".preview-embed-holder");
      if (embedHolder) {
        embedHolder.classList.remove("active");
        embedHolder.innerHTML = "";
      }
      card._embedLoaded = false;
    }

    renderFrameCanvas(card, pct) {
      const canvas = card.querySelector(".preview-canvas");
      const img = card.querySelector(".thumb-wrap img");
      if (!canvas || !img || !img.complete || !img.naturalWidth) return;

      canvas.style.display = "block";
      const w = canvas.width = 320;
      const h = canvas.height = 180;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const zoom = 1.08 + Math.sin(pct * Math.PI) * 0.12;
      const shiftX = (pct - 0.5) * 40;
      const shiftY = Math.sin(pct * Math.PI * 2) * 12;

      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-w / 2 + shiftX, -h / 2 + shiftY);
      ctx.drawImage(img, 0, 0, w, h);
      ctx.restore();

      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, "rgba(0,0,0,0.2)");
      grad.addColorStop(0.5, "rgba(255,255,255,0.04)");
      grad.addColorStop(1, "rgba(0,0,0,0.2)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    mountPreviewEmbed(card) {
      const holder = card.querySelector(".preview-embed-holder");
      if (!holder || holder.querySelector("iframe") || holder.querySelector("video")) return;
      // Prefer short MP4 preview (Server 3) — faster than iframe
      const mp4 = card.dataset.preview;
      if (mp4) {
        holder.innerHTML = `<video src="${this.esc(mp4)}" muted autoplay playsinline loop style="width:100%;height:100%;object-fit:cover;"></video>`;
        holder.classList.add("active");
        card._embedLoaded = true;
        // Cap live preview at ~5s then pause
        setTimeout(() => {
          const vid = holder.querySelector("video");
          if (vid) try { vid.pause(); } catch (_) {}
        }, 5000);
        return;
      }
      const embed = card.dataset.embed;
      if (!embed) return;
      const sep = embed.includes("?") ? "&" : "?";
      const previewUrl = this.buildThemedEmbedUrl(embed + sep + "muted=1&autoplay=1&controls=0");
      holder.innerHTML = `<iframe src="${this.esc(previewUrl)}" allow="autoplay; encrypted-media" loading="lazy"></iframe>`;
      holder.classList.add("active");
      card._embedLoaded = true;
    }

    initScrollPreview() {
      if (this._scrollCheckBound) {
        window.removeEventListener("scroll", this._scrollCheckBound);
      }
      this._scrollCheckBound = () => {
        clearTimeout(this._scrollDebounce);
        this._scrollDebounce = setTimeout(() => {
          this.checkScrollPreview();
        }, 220);
      };
      window.addEventListener("scroll", this._scrollCheckBound, { passive: true });
    }

    checkScrollPreview() {
      if (this.tab !== "home" || this.activeVideo || this.selectedCat) {
        this.stopScrollPreview();
        return;
      }
      const cards = document.querySelectorAll("#videosGrid .video-card");
      if (!cards || !cards.length) return;

      const viewportCenter = window.innerHeight / 2;
      let focalCard = null;
      let minDistance = Infinity;

      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        if (rect.bottom > 80 && rect.top < window.innerHeight - 80) {
          const cardCenter = rect.top + rect.height / 2;
          const dist = Math.abs(cardCenter - viewportCenter);
          if (dist < minDistance && dist < window.innerHeight * 0.35) {
            minDistance = dist;
            focalCard = card;
          }
        }
      });

      if (focalCard && focalCard !== this._activeScrollCard) {
        this.stopScrollPreview();
        this._activeScrollCard = focalCard;
        this.startCardPreview(focalCard, "scroll");
      } else if (!focalCard) {
        this.stopScrollPreview();
      }
    }

    stopScrollPreview() {
      if (this._activeScrollCard) {
        this.stopCardPreview(this._activeScrollCard);
        this._activeScrollCard = null;
      }
    }

    onImgProgress(el) {
      if (!el) return;
      const hi = el.getAttribute("data-hi");
      if (hi && hi !== el.src && !el.dataset.upgraded) {
        el.dataset.upgraded = "1";
        const full = new Image();
        full.decoding = "async";
        full.onload = () => {
          el.src = hi;
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.onerror = () => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.src = hi;
      } else {
        requestAnimationFrame(() => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        });
      }
    }

          result = this._prefetch;

          const mctx = this.selectedCat ? "collection" : (keyword ? "search" : (typeId ? "category" : "homeLower"));
          result = await this.fetchVideos({ page: this.page, typeId, keyword, section: mctx });

        const ids = new Set(this.videos.map(v => v.id));

    updateCollectionMetadata(cat) {
      if (!cat) return;
      const defaultDomain = "https://www.p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const logoUrl = `${origin}/logo.png`;
      const thumbUrl = cat.thumb || logoUrl;
      const colUrl = `${origin}/?collection=${cat.id}`;
      const title = `${cat.name} Collection - Watch HD Videos on p0rn`;
      const desc = `Explore the ${cat.name} video collection on p0rn. High quality HD video streaming.`;

      document.title = title;
      const setAttr = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      };
      setAttr("canonicalUrl", "href", colUrl);
      setAttr("metaDescription", "content", desc);
      setAttr("ogType", "content", "website");
      setAttr("ogTitle", "content", title);
      setAttr("ogDesc", "content", desc);
      setAttr("ogImage", "content", thumbUrl);
      setAttr("ogImageSecure", "content", thumbUrl);
      setAttr("ogUrl", "content", colUrl);
      setAttr("twTitle", "content", title);
      setAttr("twDesc", "content", desc);
      setAttr("twImage", "content", thumbUrl);

      const schemaEl = document.getElementById("schemaStructuredData");
      if (schemaEl) {
        const data = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": `${origin}/#organization`,
              "name": "p0rn",
              "url": `${origin}/`,
              "logo": {
                "@type": "ImageObject",
                "url": logoUrl,
                "width": 1671,
                "height": 941,
                "caption": "p0rn Logo"
              },
              "image": logoUrl
            },
            {
              "@type": "CollectionPage",
              "name": `${cat.name} Collection`,
              "description": desc,
              "url": colUrl,
              "about": cat.name,
              "publisher": {
                "@id": origin ? `${origin}/#organization` : "#organization"
              }
            }
          ]
        };
        schemaEl.textContent = JSON.stringify(data, null, 2);
      }

    /* PLAYER */
    async playVideo(id, updateUrl = true) {
      let v = this.videos.find(x => String(x.id) === String(id))
        || (this._playerRelated && this._playerRelated.find(x => String(x.id) === String(id)))
        || this.history.find(x => String(x.id) === String(id));

      const isPlayerAlreadyOpen = Boolean(document.getElementById("playerScreenBox"));

      if (!v || !v.embed) {
        if (isPlayerAlreadyOpen) {
          const screenBox = document.getElementById("playerScreenBox");
          if (screenBox) {
            screenBox.innerHTML = `<div class="player-fallback"><div class="spinner"></div><p>Loading video…</p></div>`;
          }
        } else {
          this.showLoading("Loading video…");
        }
        try {
          if (String(id).startsWith("ep_") || (v && v._source === "2")) {
            v = await epornerById(id);
          } else if (String(id).startsWith("xt_") || (v && v._source === "3")) {
            v = await xxxtvById(id);
          } else {
            const data = await apiFetch({ ac: "detail", ids: String(id) });
            if (data.list && data.list[0]) {
              v = normalizeVideo(data.list[0]);
            }
          }
        } catch (e) {
          console.error(e);
          this.toast("Could not load video");
          return;
        }
      }

      if (!v) {
        this.toast("Video not found");
        return;
      }

      if (!this.activeVideo) {
        this._savedScrollTop = window.scrollY || document.documentElement.scrollTop || 0;
      }
      this.activeVideo = v;

      // History
      this.history = this.history.filter(h => String(h.id) !== String(id));
      this.history.unshift({
        id: v.id,
        title: v.title,
        thumbnail: v.thumbnail || v.poster,
        duration: v.duration,
        category: v.category,
        timeAgo: "Just now",
        embed: v.embed
      });
      if (this.history.length > 50) this.history.pop();
      localStorage.setItem("p0rn_hist", JSON.stringify(this.history));

      if (updateUrl) {
        try {
          const newUrl = `${window.location.pathname}?v=${v.id}`;
          if (window.location.search !== `?v=${v.id}`) {
            history.pushState({ videoId: v.id }, v.title, newUrl);
          }
        } catch (_) {}
      }
      this.updateMetadata(v);

      if (isPlayerAlreadyOpen && document.getElementById("playerIframe")) {
        this.updatePlayerInPlace(v);
      } else {
        this.renderPlayer(v);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      this.loadRelatedForPlayer(v);
    }

    updatePlayerInPlace(v) {
      const themedEmbedUrl = this.buildThemedEmbedUrl(v.embed);
      const screenBox = document.getElementById("playerScreenBox");
      const existingIframe = document.getElementById("playerIframe");

      if (existingIframe && themedEmbedUrl) {
        existingIframe.src = themedEmbedUrl;
        existingIframe.title = v.title || "";
      } else if (screenBox) {
        screenBox.innerHTML = themedEmbedUrl
          ? `<iframe
                id="playerIframe"
                src="${this.esc(themedEmbedUrl)}"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen
                referrerpolicy="origin"
                loading="eager"
                title="${this.esc(v.title)}"
              ></iframe>`
          : `<div class="player-fallback"><p>No playable link for this video.</p></div>`;
      }

      const watchTitle = document.getElementById("watchTitle");
      if (watchTitle) {
        watchTitle.textContent = v.title;
        watchTitle.title = v.title;
        watchTitle.classList.add("single-line");
      }

      const moreBtn = document.getElementById("watchMoreBtn");
      if (moreBtn) moreBtn.style.display = "inline-block";

      const expCard = document.getElementById("watchExpandedCard");
      if (expCard) {
        expCard.style.display = "none";
        expCard.innerHTML = `
          <div class="expanded-full-title">${this.esc(v.title)}</div>
          <div class="expanded-chips-row">
            <span class="exp-chip">📁 ${this.esc(v.category)}</span>
            <span class="exp-chip">⏱ ${this.esc(v.duration)}</span>
            <span class="exp-chip">👁 ${this.esc(v.quality || v.views || "HD")}</span>
            <span class="exp-chip">📅 ${this.esc(v.ago)}</span>
          </div>
          ${v.actors && v.actors.length ? `<div class="expanded-actors"><b>Cast:</b> ${this.esc(v.actors.join(", "))}</div>` : ""}
          <button class="watch-less-btn" onclick="app.toggleWatchMore()" type="button">Show less ▴</button>
        `;
      }

      const statsEl = document.querySelector(".watch-stats");
      if (statsEl) {
        statsEl.innerHTML = `
          <span>${this.esc(v.quality || v.views || "HD")}</span>
          <span> • </span>
          <span>${this.esc(v.duration)}</span>
          <span> • </span>
          <span>${this.esc(v.ago)}</span>
          <span> • </span>
          <span>${this.esc(v.category)}</span>
        `;
      }

      const likeBtn = document.getElementById("likeBtn");
      if (likeBtn) {
        const liked = this.isLiked(v.id);
        likeBtn.className = `action-pill ${liked ? "liked" : ""}`;
        likeBtn.setAttribute("onclick", `app.toggleLike(${v.id})`);
        const label = likeBtn.querySelector(".like-label");
        if (label) label.textContent = liked ? "Liked" : "Like";
      }

      const shareBtn = document.querySelector(".player-actions .action-pill.solid");
      if (shareBtn) {
        shareBtn.setAttribute("onclick", `app.shareVideo(${v.id})`);
      }

      const backBtn = document.querySelector(".player-back-btn span:last-child");
      if (backBtn) {
        const backLabel = this.selectedCat
          ? `${this.selectedCat.name} Collection`
          : (this.tab === "category" ? "Collections" : "Feed");
        backBtn.textContent = `Back to ${backLabel}`;
      }

      const upNextList = document.getElementById("upNextList");
      if (upNextList) {
        upNextList.style.opacity = "0.5";
      }
    }

    async loadRelatedForPlayer(v) {
      try {
        let result;
        if (v.typeId) {
          result = await this.fetchVideos({ page: 1, typeId: v.typeId, section: "category" });
        } else if (v.category) {
          result = await this.fetchVideos({ page: 1, keyword: v.category, section: "search" });
        } else {
          const words = (v.title || "").split(/[\s_\-]+/).filter(w => w.length > 3).slice(0, 2).join(" ");
          result = await this.fetchVideos({ page: 1, keyword: words || "hot", section: "search" });
        }
        const related = (result.list || []).filter(x => String(x.id) !== String(v.id)).slice(0, 12);
        this._playerRelated = related;
        const box = document.getElementById("upNextList");
        if (!box) return;
        box.style.opacity = "1";
        if (!related.length) {
          box.innerHTML = `<p style="color:var(--cream-dim);font-size:13px;">No related videos found.</p>`;
          return;
        }
        box.innerHTML = related.map(r => `
          <a href="?v=${r.id}" class="up-card" onclick="app.onCardClick(${r.id}, event)">
            <div class="up-thumb">
              ${r.thumbnail
                ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                : ""}
              <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
            </div>
            <div class="up-info">
              <div class="up-t">${this.esc(r.title)}</div>
              <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
            </div>
          </a>
        `).join("");
      } catch (e) {
        console.warn("related fail", e);
        const box = document.getElementById("upNextList");
        if (box) box.style.opacity = "1";
      }
    }

    /* THEMED EMBED URL BUILDER (Uses upstream player built-in minimal cinema theme & matching colors) */
    buildThemedEmbedUrl(embedUrl) {
      if (!embedUrl) return "";
      // External embeds (S2 / S3): return as-is (no upload18 theme params)
      if (/eporner\.com|xxxtv\.top/i.test(embedUrl)) return embedUrl;
      const currentTheme = "minimal";
      const currentColor = this.creamTheme ? "8B2E1A" : "F4D59A";
      try {
        const u = new URL(embedUrl, "https://upload18.net");
        u.searchParams.set("theme", currentTheme);
        u.searchParams.set("color", currentColor);
        return u.toString();
      } catch (_) {
        const sep = embedUrl.includes("?") ? "&" : "?";
        return `${embedUrl}${sep}theme=${currentTheme}&color=${currentColor}`;
      }
    }

                        ? '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>'
                        : '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>'}
                    </span>
                    <span>Theme</span>
                  </button>
                  <button class="action-pill solid" onclick="app.shareVideo(${v.id})">
                    <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></span>
                    <span>Share</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="player-side-col">
              <div class="up-next-title">Related for you</div>
              <div class="up-next-list" id="upNextList">
                ${related.length
                  ? related.map(r => `
                    <a href="?v=${r.id}" class="up-card" onclick="app.onCardClick(${r.id}, event)">
                      <div class="up-thumb">
                        ${r.thumbnail
                          ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                          : ""}
                        <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
                      </div>
                      <div class="up-info">
                        <div class="up-t">${this.esc(r.title)}</div>
                        <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
                      </div>
                    </a>
                  `).join("")
                  : `<p style="color:var(--cream-dim);font-size:13px;">No related videos loaded.</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    stopPlayerRuntime() {
      // Safe no-op stub for runtime cleanups
    }

    shareVideo(id) {
      const v = this.videos.find(x => String(x.id) === String(id))
        || this.history.find(x => String(x.id) === String(id))
        || this.activeVideo;
      const targetId = v ? v.id : id;
      const defaultDomain = "https://www.p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const url = targetId
        ? `${origin}/?v=${targetId}`
        : `${origin}/`;
      const title = v ? `${v.title} - p0rn` : "p0rn - Watch Quality Videos";

      if (navigator.share) {
        navigator.share({
          title: title,
          text: title,
          url: url
        }).catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => this.toast("Video link copied to clipboard!"))
          .catch(() => this.toast("URL: " + url));
      } else {
        this.toast("URL: " + url);
      }
    }

    closePlayer(updateUrl = true) {
      this.stopPlayerRuntime();
      if (this._keyHandler) {
        window.removeEventListener("keydown", this._keyHandler);
        this._keyHandler = null;
      }
      this.activeVideo = null;

      if (updateUrl) {
        try {
          const cleanUrl = this.selectedCat
            ? `${window.location.pathname}?collection=${this.selectedCat.id}`
            : window.location.pathname;
          if (window.location.search) {
            history.pushState({ page: this.selectedCat ? "collection" : "home" }, "p0rn - Watch Quality Videos", cleanUrl);
          }
        } catch (_) {}
      }
      this.restoreDefaultMetadata();

      if (this.selectedCat) {
        this.renderCategoryHub(this.selectedCat);
      } else {
        this.tab = "home";
        this.renderNav();
        this.renderCategoryBar();
        if (this.videos && this.videos.length) {
          this.renderHome();
        } else {
          this.loadAndRenderHome();
        }
      }

      // Smoothly restore previous scroll position so user never loses their place
      const targetScroll = this._savedScrollTop || 0;
      requestAnimationFrame(() => {
        window.scrollTo({ top: targetScroll, behavior: targetScroll > 0 ? "instant" : "smooth" });
      });
    }

    onPlayerBackClick() {
      if (window.history.length > 1 && window.location.search.includes("v=")) {
        window.history.back();
      } else {
        this.closePlayer(true);
      }
    }

    toggleWatchMore() {
      const card = document.getElementById("watchExpandedCard");
      const moreBtn = document.getElementById("watchMoreBtn");
      const title = document.getElementById("watchTitle");
      if (!card) return;
      const isHidden = card.style.display === "none";
      card.style.display = isHidden ? "block" : "none";
      if (moreBtn) {
        moreBtn.style.display = isHidden ? "none" : "inline-block";
      }
      if (title) {
        title.classList.toggle("single-line", !isHidden);
      }
    }

    /* SEO & METADATA ENGINE (Open Graph, Twitter, Schema.org Logo & Video) */
    secondsToIsoDuration(val) {
      if (!val || val === "—") return "PT15M";
      if (typeof val === "number") {
        const h = Math.floor(val / 3600);
        const m = Math.floor((val % 3600) / 60);
        const s = Math.floor(val % 60);
        let iso = "PT";
        if (h) iso += h + "H";
        if (m || h) iso += m + "M";
        iso += s + "S";
        return iso;
      }
      const str = String(val).trim();
      const parts = str.split(":").map(Number);
      if (parts.length === 3 && parts.every(n => !isNaN(n))) {
        return `PT${parts[0]}H${parts[1]}M${parts[2]}S`;
      }
      if (parts.length === 2 && parts.every(n => !isNaN(n))) {
        return `PT${parts[0]}M${parts[1]}S`;
      }
      const digits = parseInt(str.replace(/\D/g, ""), 10);
      if (!isNaN(digits) && digits > 0) {
        return `PT${digits}M`;
      }
      return "PT15M";
    }

    restoreDefaultMetadata() {
      const defaultDomain = "https://www.p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const logoUrl = `${origin}/logo.png`;
      const defaultTitle = "p0rn - Watch Quality Videos";
      const defaultDesc = "Watch high quality HD streaming videos on p0rn.";
      const pageUrl = `${origin}/`;

      document.title = defaultTitle;
      const setAttr = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      };
      setAttr("canonicalUrl", "href", pageUrl);
      setAttr("metaDescription", "content", defaultDesc);
      setAttr("ogType", "content", "website");
      setAttr("ogTitle", "content", defaultTitle);
      setAttr("ogDesc", "content", defaultDesc);
      setAttr("ogImage", "content", logoUrl);
      setAttr("ogImageSecure", "content", logoUrl);
      setAttr("ogUrl", "content", pageUrl);
      setAttr("twTitle", "content", defaultTitle);
      setAttr("twDesc", "content", defaultDesc);
      setAttr("twImage", "content", logoUrl);

      const schemaEl = document.getElementById("schemaStructuredData");
      if (schemaEl) {
        const data = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": `${origin}/#organization`,
              "name": "p0rn",
              "url": `${origin}/`,
              "logo": {
                "@type": "ImageObject",
                "url": logoUrl,
                "width": 1671,
                "height": 941,
                "caption": "p0rn Logo"
              },
              "image": logoUrl
            },
            {
              "@type": "WebSite",
              "@id": `${origin}/#website`,
              "url": `${origin}/`,
              "name": "p0rn",
              "description": defaultDesc,
              "publisher": {
                "@id": `${origin}/#organization`
              }
            }
          ]
        };
        schemaEl.textContent = JSON.stringify(data, null, 2);
      }
    }

    absUrl(u, origin) {
      if (!u) return `${origin}/logo.png`;
      const s = String(u).trim();
      if (/^https?:\/\//i.test(s)) return s;
      if (s.startsWith("//")) return "https:" + s;
      if (s.startsWith("/")) return origin + s;
      return origin + "/" + s.replace(/^\.\//, "");
    }

    updateMetadata(v) {
      if (!v) return;
      const defaultDomain = "https://www.p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const logoUrl = `${origin}/logo.png`;
      // WhatsApp / OG require absolute HTTPS image URL
      const thumbUrl = this.absUrl(v.thumbnail || v.poster || logoUrl, origin);
      const videoUrl = `${origin}${videoPath(v)}`;
      const title = `${v.title} - p0rn`;
      const desc = `Watch ${v.title} free in HD on p0rn. ${v.duration ? "Duration: " + v.duration + ". " : ""}${v.category ? v.category + " video. " : ""}XXX / sex video streaming.`;

      document.title = title;
      const setAttr = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      };
      setAttr("canonicalUrl", "href", videoUrl);
      setAttr("metaDescription", "content", desc);
      setAttr("imageSrc", "href", thumbUrl);
      setAttr("ogType", "content", "video.other");
      setAttr("ogTitle", "content", title);
      setAttr("ogDesc", "content", desc);
      setAttr("ogImage", "content", thumbUrl);
      setAttr("ogImageSecure", "content", thumbUrl);
      setAttr("ogImageType", "content", /\.jpe?g/i.test(thumbUrl) ? "image/jpeg" : (/\.webp/i.test(thumbUrl) ? "image/webp" : "image/png"));
      setAttr("ogImageWidth", "content", "1200");
      setAttr("ogImageHeight", "content", "630");
      setAttr("ogImageAlt", "content", v.title || "Video preview");
      setAttr("ogUrl", "content", videoUrl);
      setAttr("twCard", "content", "summary_large_image");
      setAttr("twTitle", "content", title);
      setAttr("twDesc", "content", desc);
      setAttr("twImage", "content", thumbUrl);
      setAttr("twImageAlt", "content", v.title || "Video preview");

      const schemaEl = document.getElementById("schemaStructuredData");
      if (schemaEl) {
        const data = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": `${origin}/#organization`,
              "name": "p0rn",
              "url": `${origin}/`,
              "logo": {
                "@type": "ImageObject",
                "url": logoUrl,
                "width": 1200,
                "height": 630,
                "caption": "p0rn Logo"
              },
              "image": logoUrl
            },
            {
              "@type": "VideoObject",
              "name": v.title,
              "description": desc,
              "thumbnailUrl": [thumbUrl],
              "uploadDate": new Date().toISOString(),
              "duration": this.secondsToIsoDuration(v.duration),
              "embedUrl": v.embed || "",
              "contentUrl": videoUrl,
              "publisher": { "@id": `${origin}/#organization` }
            }
          ]
        };
        schemaEl.textContent = JSON.stringify(data, null, 2);
      }
    }

    esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  }

  let app;
  document.addEventListener("DOMContentLoaded", () => {
    app = new P0rnApp();
    window.app = app;
  });
  </script>
